<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1c0838">
  <title>Guerreira Maitê</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- padrões de brilho usados no colorir -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <pattern id="pGlitterOuro" width="18" height="18" patternUnits="userSpaceOnUse">
        <rect width="18" height="18" fill="#ffcf3f"/><circle cx="4" cy="4" r="2" fill="#fff6c2"/><circle cx="13" cy="11" r="1.5" fill="#fff"/><circle cx="7" cy="15" r="1" fill="#e09a10"/>
      </pattern>
      <pattern id="pGlitterRosa" width="18" height="18" patternUnits="userSpaceOnUse">
        <rect width="18" height="18" fill="#ff6fc4"/><circle cx="4" cy="4" r="2" fill="#ffe0f3"/><circle cx="13" cy="11" r="1.5" fill="#fff"/><circle cx="7" cy="15" r="1" fill="#c42f86"/>
      </pattern>
      <pattern id="pGlitterAzul" width="18" height="18" patternUnits="userSpaceOnUse">
        <rect width="18" height="18" fill="#56c8ff"/><circle cx="4" cy="4" r="2" fill="#e0f7ff"/><circle cx="13" cy="11" r="1.5" fill="#fff"/><circle cx="7" cy="15" r="1" fill="#2a7fd0"/>
      </pattern>
      <linearGradient id="pArcoIris" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff5f6d"/><stop offset="0.2" stop-color="#ffb83f"/><stop offset="0.4" stop-color="#ffe94a"/><stop offset="0.6" stop-color="#4ce08a"/><stop offset="0.8" stop-color="#4fb4ff"/><stop offset="1" stop-color="#b56bff"/>
      </linearGradient>
    </defs>
  </svg>

  <div id="app">
    <!-- INÍCIO -->
    <section class="screen" id="home">
      <div class="beams"></div>
      <button class="corner right" id="btnMusic" aria-label="Música">🎵</button>
      <div class="home-wrap">
        <div class="home-doll" id="homeDoll"></div>
        <div class="home-side">
          <h1 class="logo"><span>Guerreira</span><b>Maitê</b></h1>
          <div class="menu">
            <button class="menu-btn c1" data-go="dress"><i>👗</i><span>Vestir</span></button>
            <button class="menu-btn c2" data-go="lr"><i>👈👉</i><span>Escolher</span></button>
            <button class="menu-btn c3" data-go="colorList"><i>🎨</i><span>Colorir</span></button>
            <button class="menu-btn c4" data-go="memory"><i>🃏</i><span>Memória</span></button>
            <button class="menu-btn c5" data-go="gallery"><i>⭐</i><span>Meus</span></button>
          </div>
        </div>
      </div>
    </section>

    <!-- VESTIR -->
    <section class="screen" id="dress">
      <div class="topbar">
        <button class="round" data-back aria-label="Voltar">🏠</button>
        <div class="grow"></div>
        <button class="round" id="btnRandom" aria-label="Surpresa">🎲</button>
        <button class="round big ok" id="btnReady" aria-label="Pronto">✨</button>
      </div>
      <div class="dress-body">
        <div class="stage" id="dressStage"><div class="spot"></div><div class="floor"></div><div class="doll-holder" id="dressDoll"></div></div>
        <div class="panel">
          <div class="tabs" id="tabs"></div>
          <div class="options" id="options"></div>
        </div>
      </div>
    </section>

    <!-- ESQUERDA OU DIREITA -->
    <section class="screen" id="lr">
      <div class="topbar">
        <button class="round" data-back aria-label="Voltar">🏠</button>
        <div class="grow"><div class="dots" id="lrDots"></div></div>
      </div>
      <div class="lr-body">
        <button class="lr-card left" id="lrA"></button>
        <div class="lr-mid"><div class="lr-icon" id="lrIcon">👗</div><div class="lr-vs">ou</div></div>
        <button class="lr-card right" id="lrB"></button>
      </div>
    </section>

    <!-- PALCO (gira) -->
    <section class="screen" id="show">
      <div class="beams"></div>
      <canvas id="confetti"></canvas>
      <div class="topbar">
        <button class="round" data-back aria-label="Voltar">🏠</button>
        <div class="grow"></div>
        <button class="round" id="btnEdit" aria-label="Trocar roupa">👗</button>
        <button class="round" id="btnSpin" aria-label="Girar">🔄</button>
        <button class="round ok" id="btnSaveLook" aria-label="Guardar">💾</button>
      </div>
      <div class="show-stage" id="showStage">
        <div class="spot big"></div>
        <div class="floor big"></div>
        <div class="turntable" id="turn">
          <div class="spinner" id="spinner">
            <div class="face front" id="faceFront"></div>
            <div class="face back" id="faceBack"></div>
          </div>
        </div>
      </div>
      <div class="hint">👆 arraste para girar</div>
    </section>

    <!-- LISTA DE DESENHOS -->
    <section class="screen" id="colorList">
      <div class="topbar"><button class="round" data-back aria-label="Voltar">🏠</button><div class="grow title">🎨</div></div>
      <div class="grid pages" id="pageGrid"></div>
    </section>

    <!-- COLORIR -->
    <section class="screen" id="color">
      <div class="topbar">
        <button class="round" data-back aria-label="Voltar">⬅️</button>
        <div class="grow"></div>
        <button class="round" id="btnUndo" aria-label="Desfazer">↩️</button>
        <button class="round" id="btnClear" aria-label="Apagar tudo">🧽</button>
        <button class="round ok" id="btnSaveDraw" aria-label="Guardar">💾</button>
      </div>
      <div class="color-body">
        <div class="canvas-wrap" id="drawWrap"></div>
        <div class="palette" id="palette"></div>
      </div>
    </section>

    <!-- MEMÓRIA -->
    <section class="screen" id="memory">
      <div class="topbar">
        <button class="round" data-back aria-label="Voltar">🏠</button>
        <div class="grow"></div>
        <button class="round" id="memEasy" aria-label="Fácil">⭐</button>
        <button class="round" id="memHard" aria-label="Difícil">⭐⭐</button>
      </div>
      <div class="mem-board" id="memBoard"></div>
    </section>

    <!-- GALERIA -->
    <section class="screen" id="gallery">
      <div class="topbar"><button class="round" data-back aria-label="Voltar">🏠</button><div class="grow title">⭐</div></div>
      <div class="grid gal" id="galGrid"></div>
      <div class="empty" id="galEmpty">💾 ✨</div>
    </section>
  </div>

  <div id="toast"></div>

  <script src="js/doll2d.js"></script>
  <script src="js/pages.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
